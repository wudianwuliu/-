# ============================================================================
# 开放题答案库（模板）
# ----------------------------------------------------------------------------
# 网申最耗时的不是基本信息，是这些 200~500 字的开放题：每家都问、每家都要重写。
# 这里存一份底稿，工具按关键词自动匹配填进去，你只需要提交前微调。
#
#   match:  关键词列表，题干里出现任意一个（归一化后包含）就算命中
#   answer: 答案正文，支持 {{路径}} 占位符，会从 profile.yaml 取值
#           例：{{basic.name}}、{{education[0].school}}、{{intention.position}}
#   max_len: 建议上限字数；表单有 maxlength 时以表单为准（超长自动截断）
#
# ⚠️ 下面除了第一条是示例写法，其余都是占位文本，请自己写。
#    申请季最值得花的两小时，就是把这些底稿写好——写一次，几百家用。
# ============================================================================

questions:

  # ---------- 这一条演示了完整写法（占位符 + 结构），照着改就行 ----------
  - id: self_evaluation
    match: [自我评价, 自我介绍, 个人评价, 个人优势, 介绍一下自己, 个人简介, 请描述你自己]
    max_len: 400
    answer: >
      我是{{basic.name}}，{{education[0].school}}{{education[0].major}}专业{{education[0].graduation_year}}届本科生。
      主攻数据开发方向，完整实践过「数据采集 → 数仓分层建模 → 指标计算 → 可视化看板」的全链路。
      做事偏踏实，习惯用数据说话：指标对不上会一直查到根因，交付的东西会考虑能不能长期稳定运行。
      （提示：把这一段换成你自己的真实经历和数字，不要照抄示例。）

  # ---------- 以下请在投递前逐个补写 ----------
  - id: career_plan
    match: [职业规划, 职业生涯规划, 未来规划, 职业目标, 发展规划, 三到五年, 3-5年]
    max_len: 400
    answer: （待写：短期 1 年做什么、中期 2-3 年到什么水平、长期想成为什么样的人。写具体岗位和技能，别写空话。）

  - id: why_company
    match: [为什么选择我们, 为什么应聘我们, 为什么想来, 选择本公司的原因, 对公司的了解, 为什么投递, 应聘理由]
    max_len: 400
    answer: （待写：分三点——业务/数据量级为什么吸引你；你的能力结构和这个岗位哪里对得上；你的做事方式为什么适合这家公司。）

  - id: why_position
    match: [为什么应聘这个岗位, 为什么适合这个岗位, 岗位理解, 对该岗位的认识, 你为什么能胜任]
    max_len: 400
    answer: （待写：把 JD 里的要求逐条对上你的技能和项目，一条一行，别堆形容词。）

  - id: achievement
    match: [最有成就感, 最成功的一件事, 最大的成就, 最自豪, 印象深刻的一件事]
    max_len: 400
    answer: （待写：STAR 结构——背景、你做了什么、结果数字是多少、你的感受。挑一个能体现你解决问题能力的事。）

  - id: challenge
    match: [最大的困难, 遇到的困难, 如何解决困难, 最有挑战, 最大的挑战, 挫折, 失败的经历]
    max_len: 400
    answer: （待写：重点不是"困难多大"，而是你的排查过程和方法论。最后加一句"这件事让我明白…"。）

  - id: strength_weakness
    match: [优点和缺点, 优势和劣势, 你的优点, 你的缺点, 长处和短处]
    max_len: 400
    answer: （待写：优点要配证据（哪个项目体现的）；缺点要真且带改进动作，别说"我太追求完美"。）

  - id: hobby
    match: [兴趣爱好, 业余爱好, 特长, 平时的爱好, 兴趣特长]
    max_len: 300
    answer: （待写：写真的。如果爱好和岗位有点关系（折腾技术、写小工具），顺手提一句。）

  - id: project_intro
    match: [介绍一个项目, 最满意的项目, 项目经历介绍, 请描述你参与的项目]
    max_len: 500
    answer: （待写：背景 → 你做了什么 → 结果数字。这是技术面最会被追问的一段，务必背熟。）

  - id: teamwork
    match: [团队合作, 团队协作, 团队冲突, 与他人合作, 团队中的角色]
    max_len: 350
    answer: （待写：写一次真实的分工/分歧，以及你用什么办法推进的。）

  - id: city_intention
    match: [为什么选择这个城市, 为什么想去, 城市意向说明, 是否愿意到外地工作]
    max_len: 300
    answer: （待写：说清你能接受的范围和原因，别显得什么都能接受。）

  - id: additional
    match: [补充说明, 其他需要说明, 还有什么想说的, 其他信息补充]
    max_len: 300
    answer: （待写：一到两句，补充你觉得简历没写下的亮点，或者表态。没有就留空跳过。）

  - id: why_hire_you
    match: [为什么要录用你, 录用你的理由, 你比其他候选人强在哪, 你的核心竞争力]
    max_len: 350
    answer: （待写：三点，每点一句话 + 一个证据。）

  - id: family_situation
    match: [家庭情况, 家庭基本情况, 家庭成员情况介绍]
    max_len: 250
    answer: （待写：一两句，说明家庭稳定、支持你到外地工作即可。）

  - id: internship_gain
    match: [实习收获, 实习中学到了什么, 实习的成长]
    max_len: 300
    answer: （待写：有实习就写具体收获；没有就诚实说明你的实践来自项目，并写你想在实习里学什么。）
