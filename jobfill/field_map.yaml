# ============================================================================
# 字段识别表：网申表单上的中文标签 → profile.yaml 里的字段
# ----------------------------------------------------------------------------
# 这是整个工具的「大脑」。识别不准时，只需要往这里加一条别名，下次就准了。
# 也可以完全不管它：用 `fill --learn` 跑一遍，工具会问你未识别的字段，
# 答案自动写进 learned.yaml，优先级高于本文件。
#
# 匹配规则（按优先级）：
#   1. normalize 后完全相等        → 1.00
#   2. 别名是标签的子串/反之        → 0.86~0.98（越接近越长越得分）
#   3. 编辑距离相似度 ≥ 0.72        → 0.55~0.85
#   4. exclude 里出现任一关键词    → 直接 0 分（防止把「姓名」填进「父亲姓名」）
# ============================================================================

# 每个顶层分组对应的中文区块标题（用于确认字段出现在表单的哪一块）
group_sections:
  basic: [基本信息, 个人信息, 个人资料, 应聘者信息, 我的信息, 基本信息填写, 个人基本信息]
  intention: [求职意向, 应聘意向, 意向岗位, 求职意愿, 应聘信息]
  education: [教育经历, 教育背景, 学习经历, 教育信息, 学历信息, 教育情况]
  internship: [实习经历, 工作经历, 实习经验, 工作经验, 实习信息]
  project: [项目经历, 项目经验, 项目信息, 科研经历]
  scores: [成绩, 成绩信息, 证书, 语言能力, 技能证书, 荣誉, 获奖情况, 证书信息]
  skills: [专业技能, 技能特长, 技能, 专业特长]
  language: [语言能力, 外语水平, 语言水平]
  family: [家庭, 家庭成员, 家庭主要成员, 家庭信息, 亲属, 家庭情况]
  emergency: [紧急联系人, 紧急联络人, 紧急联系人信息]
  misc: [其他, 其他信息, 补充信息, 声明, 其他说明]

# 落在这些区块里的字段，默认不填（除非 profile 里明确提供了 family./emergency. 数据）
# 目的：绝不把你的姓名/手机号误填到「父亲姓名」「紧急联系人电话」里
danger_sections: [家庭, 家庭成员, 家庭主要成员, 家庭信息, 家属, 亲属, 社会关系, 紧急联系, 紧急联络, 监护人, 推荐人, 配偶, 父, 母]

# 永远不要碰的字段（含这些词的标签直接跳过）
ignore_labels:
  - 验证码
  - 短信验证码
  - 图形验证码
  - 手机验证码
  - 邮箱验证码
  - captcha
  - 密码
  - 确认密码
  - 新密码
  - 原始密码
  - 搜索
  - 查询
  - 请输入关键字

# 枚举值同义词：profile 里写的值 → 表单选项可能的写法
