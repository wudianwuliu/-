  "大学英语四级": [大学英语四级, 英语四级, 四级, cet4, cet-4, cet 4]
  "大学英语六级": [大学英语六级, 英语六级, 六级, cet6, cet-6, cet 6]
  "全国": [全国, 不限, 不限城市, 均可, 不限地区, 全国范围]
