  "是": [是, 有, 同意, 接受, 可以, 会, 愿意, 参加, 已参加, yes, y, true]
  "否": [否, 没有, 无, 不同意, 不接受, 不可以, 不会, 未曾, 未参加, no, n, false, 都不]
  "无": [无, 否, 没有, 不曾, 未, 都不, 暂无]
  "有": [有, 是, 曾, 曾经]
  "男": [男, 男性]
  "女": [女, 女性]
  "本科": [本科, 大学本科, 全日制本科, 本科生, 学士, 本科(学士), 学士学位]
  "硕士": [硕士, 硕士研究生, 研究生, 硕士学位]
  "博士": [博士, 博士研究生]
